<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Architect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-lg font-bold tracking-tight">Local AI Architect</h1>
      <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full font-mono">develop branch</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- Chat Section (Left Side) -->
    <section class="flex-1 flex flex-col bg-slate-900/20 border-r border-slate-800">
      <!-- Message Stream -->
      <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4">
        <div class="max-w-2xl bg-slate-800/40 border border-slate-800/60 p-4 rounded-xl">
          <p class="text-sm leading-relaxed text-slate-300">
            Hello! I am your self-contained local assistant. You can ask me standard questions, or instruct me to change my personality file or modify my backend execution script.
          </p>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-4 border-t border-slate-800 bg-slate-950">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-3">
          <input 
            type="text" 
            id="user-input" 
            placeholder="e.g. 'Modify yourself to print a welcome message on startup'" 
            class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-slate-600 transition"
            required
          />
          <button 
            type="submit" 
            class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-6 py-3 rounded-lg transition"
          >
            Send
          </button>
        </form>
      </div>
    </section>

    <!-- Diff Review Drawer (Right Side) -->
    <section id="diff-panel" class="w-[500px] xl:w-[650px] bg-slate-950 border-l border-slate-800 flex flex-col hidden">
      <div class="p-6 border-b border-slate-800 bg-slate-900/30 flex items-center justify-between">
        <div>
          <h2 class="text-md font-semibold text-slate-200">Proposed Code / System Modifications</h2>
          <p class="text-xs text-slate-400 mt-1">Review the git diff before merging changes into develop</p>
        </div>
      </div>

      <!-- Diff Output -->
      <div class="flex-1 overflow-auto p-4 font-mono text-xs leading-5 bg-slate-950" id="diff-container">
        <!-- Lines injected here dynamically -->
      </div>

      <!-- Action Panel -->
      <div class="p-6 border-t border-slate-800 bg-slate-900/30 flex space-x-3">
        <button 
          onclick="handleAction('approve')" 
          class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold py-3 rounded-lg transition"
        >
          Approve & Merge
        </button>
        <button 
          onclick="handleAction('reject')" 
          class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold py-3 rounded-lg transition"
        >
          Discard Changes
        </button>
      </div>
    </section>
  </main>

  <!-- Client-side Scripting -->
  <script>
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatMessages = document.getElementById('chat-messages');
    const diffPanel = document.getElementById('diff-panel');
    const diffContainer = document.getElementById('diff-container');

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage('user', message);
      userInput.value = '';

      // Set Loading State
      const loadingId = appendMessage('system', 'Thinking...');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        
        removeMessage(loadingId);

        if (data.error) {
          appendMessage('system', `Error: ${data.error}`);
          return;
        }

        if (data.response) {
          appendMessage('assistant', data.response);
        }

        if (data.hasProposedChanges) {
          showDiff(data.diff);
        }
      } catch (err) {
        removeMessage(loadingId);
        appendMessage('system', 'Failed to communicate with local backend.');
      }
    });

    function appendMessage(sender, text) {
      const msgId = 'msg-' + Date.now();
      const div = document.createElement('div');
      div.id = msgId;
      div.className = sender === 'user' 
        ? "max-w-xl ml-auto bg-blue-600/10 border border-blue-500/20 p-4 rounded-xl text-slate-200" 
        : "max-w-xl bg-slate-800/40 border border-slate-800/60 p-4 rounded-xl text-slate-300";
      
      div.innerHTML = `<p class="text-xs font-semibold uppercase tracking-wider mb-1 text-slate-500">${sender}</p><p class="text-sm leading-relaxed">${text.replace(/\n/g, '<br>')}</p>`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msgId;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function showDiff(diffString) {
      diffContainer.innerHTML = '';
      diffPanel.classList.remove('hidden');

      if (!diffString) {
        diffContainer.innerHTML = '<div class="text-slate-500">No modifications detected in diff workspace.</div>';
        return;
      }

      // Render line-by-line colored git diff output
      const lines = diffString.split('\n');
      lines.forEach(line => {
        const div = document.createElement('div');
        if (line.startsWith('+') && !line.startsWith('+++')) {
          div.className = 'text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded';
        } else if (line.startsWith('-') && !line.startsWith('---')) {
          div.className = 'text-rose-400 bg-rose-950/40 px-2 py-0.5 rounded';
        } else if (line.startsWith('@@')) {
          div.className = 'text-cyan-500 bg-slate-900/60 px-2';
        } else {
          div.className = 'text-slate-400 px-2';
        }
        div.textContent = line;
        diffContainer.appendChild(div);
      });
    }

    async function handleAction(endpoint) {
      try {
        const response = await fetch(`/api/${endpoint}`, { method: 'POST' });
        const data = await response.json();
        
        if (data.error) {
          alert(`Error: ${data.error}`);
          return;
        }

        alert(data.message);
        diffPanel.classList.add('hidden');
        
        if (endpoint === 'approve') {
          appendMessage('system', 'Workspace modified. Reloading runtime server to apply changes...');
          // Give the server 1.5 seconds to watch and reload before refreshing client UI
          setTimeout(() => { window.location.reload(); }, 1500);
        }
      } catch (err) {
        alert('Action failed. Is backend still running?');
      }
    }
  </script>
</body>
</html>
